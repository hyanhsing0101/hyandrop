services:
  postgres:
    image: postgres:17-alpine
    container_name: hyandrop-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hyandrop}
      POSTGRES_USER: ${POSTGRES_USER:-hyandrop}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hyandrop_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deployment/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: hyandrop-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: ./backend
      target: dev
    container_name: hyandrop-backend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "go mod download && go run ./cmd/server"]
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_NAME: ${APP_NAME:-HyanDrop}
      DATABASE_URL: ${DATABASE_URL:-postgres://hyandrop:hyandrop_dev_password@postgres:5432/hyandrop?sslmode=disable}
      REDIS_ADDR: ${REDIS_ADDR:-redis:6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      HTTP_ADDR: ${HTTP_ADDR:-:8080}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5173}
      ROOM_TTL_HOURS: ${ROOM_TTL_HOURS:-24}
      MAX_FILE_SIZE_MB: ${MAX_FILE_SIZE_MB:-100}
      UPLOAD_ROOT: ${UPLOAD_ROOT:-/data/uploads}
    volumes:
      - ./backend:/app
      - ./storage/uploads:/data/uploads
      - go_mod_cache:/go/pkg/mod
    ports:
      - "${BACKEND_PORT:-18080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: hyandrop-frontend
    restart: unless-stopped
    working_dir: /app
    command: ["sh", "-c", "npm install && npm run dev -- --host 0.0.0.0"]
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_DEV_API_PROXY_TARGET: ${VITE_DEV_API_PROXY_TARGET:-http://backend:8080}
      VITE_DEV_WS_PROXY_TARGET: ${VITE_DEV_WS_PROXY_TARGET:-ws://backend:8080}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  go_mod_cache:
  frontend_node_modules:
